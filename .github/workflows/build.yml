name: Windows build and archive checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build from public source without publishing credentials
        shell: powershell
        run: ./scripts/Build.ps1
      - name: Exercise archives and updater launch
        shell: powershell
        run: |
          python tests/verify.py --cancel-check --skip-rar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_editing.py --skip-rar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_rar.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/verify_updater_workdir.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
